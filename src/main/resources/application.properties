# ===============================
# CONFIGURACIÓN GENERAL
# ===============================
spring.application.name=barberia-backend
server.port=8080

# ===============================
# BASE DE DATOS (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/barberia_db
spring.datasource.username=barberia_user
spring.datasource.password=barberia123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# 'update' crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SEGURIDAD Y JWT (JSON Web Token)
# ===============================
# NOTA: Cambia esta clave por una más segura en producción
jwt.secret=MI_CLAVE_SUPER_SECRETA_PARA_BARBERIA_APP_CAMBIAR_EN_PRODUCCION_2026
# Expiración: 86400000ms = 24 Horas
jwt.expiration-ms=86400000

# ===============================
# LOGGING (Opcional para depuración)
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.barberia=DEBUG

# ===============================
# EMAIL CONFIGURATION
# ===============================

app.mail.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# WHATSAPP CONFIGURATION
# ===============================
# Canal preparado para integrar proveedor externo. En false se registra como omitido/simulado.
app.whatsapp.enabled=false
